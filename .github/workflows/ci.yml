name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Engine tests (offline, no API key)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # TODO(build-order step 7): accuracy + latency gate job. Makes real
  # gpt-4.1-mini calls against the fixture set, needs OPENAI_API_KEY as a repo
  # secret (so it cannot run on fork PRs), and blocks merge when accuracy
  # regresses or warm p95 exceeds 5 seconds. See docs/approach.md section 6.
