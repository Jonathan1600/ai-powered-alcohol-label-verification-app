[project]
name = "label-verification-backend"
version = "0.1.0"
description = "FastAPI backend for the TTB label verification prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Floored at the version phase 4 was built and measured against. The reader
    # uses the Responses API with a Pydantic text_format, and the latency and
    # accuracy numbers in the README were taken on this line.
    "openai>=3.2",
    "pydantic-settings>=2.7",
    # Required by FastAPI to accept multipart form data, which is how the verify
    # endpoint receives an image and the claimed record in one request.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]
# Only needed to regenerate the fixture images, which are committed. Kept out of
# `dev` so CI stays lean and Render's `uv sync --no-dev` build never sees it:
# install with `uv sync --group fixtures` when running tools/generate_fixtures.py.
fixtures = [
    "pillow>=11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: sends a real request to the OpenAI API. Needs OPENAI_API_KEY and costs money.",
]
# Live tests are opt-in. Phase 2 promised the suite runs with no API key present
# and that promise is what keeps the engine independently testable, so the
# default selection stays offline and an explicit -m live asks for the rest.
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
